name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@21b556478d51be2e553cb1bf790b54b1812e3fce # main
    with:
      install-for-publish: false
    secrets: inherit
